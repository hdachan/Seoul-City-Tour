<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${guideName} + ' 가이드님 관광객 명단'">관광객 명단</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f9f9f9; padding: 20px; }
        .header-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; table-layout: fixed; }
        .header-table th, .header-table td { border: 1px solid #888; padding: 8px; text-align: center; font-size: 13px; background: #f5f5f5; }
        .header-table th { background: #e0e0e0; font-weight: bold; }
        .main-table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 20px; }
        .main-table th, .main-table td { border: 1px solid #888; padding: 10px; text-align: center; font-size: 13px; }
        .main-table th { background: #467FF7; color: white; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; }
        .print-btn { background: #467FF7; color: white; padding: 12px 30px; border: none; border-radius: 50px; font-size: 16px; }
        .total-row { background: #fffbe6 !important; font-weight: bold; font-size: 18px; color: #d32f2f; }
        @media print {
            body { padding: 10mm; background: white; }
            .no-print { display: none !important; }
            .total-row { background: #fffbe6 !important; }
        }
    </style>
</head>
<body>

<div class="container-fluid">

    <!-- 날짜 선택 + 버튼 -->
    <div class="controls no-print">
        <input type="date" id="dateFilter" class="form-control" style="width: 200px;">
        <button class="print-btn" onclick="loadTourists()">조회</button>
        <button class="print-btn" onclick="window.print()">인쇄 / PDF 저장</button>
    </div>

    <!-- 상단 정보 테이블 -->
    <table class="header-table">
        <tr>
            <th>단체명</th>
            <td colspan="2">Seoul City Tour</td>
            <th>인솔자</th>
            <td th:text="${guideName}">고경자</td>
            <th>연락처</th>
            <td colspan="2" th:text="${guidePhone}">010-9111-2599</td>
        </tr>
        <tr>
            <th>차량번호</th>
            <td colspan="2">-</td>
            <th>운전기사</th>
            <td>-</td>
            <th>연락처</th>
            <td colspan="2">-</td>
        </tr>
        <tr class="total-row">
            <th>총인원</th>
            <td>승객</td>
            <td id="passengerCount">0</td>
            <td>기사</td>
            <td>1</td>
            <td colspan="3"></td>
        </tr>
    </table>

    <!-- 관광객 목록 테이블 -->
    <table class="main-table">
        <thead>
        <tr>
            <th>No.</th>
            <th>NAME</th>
            <th>Date of Birth</th>
            <th>Phone No.</th>
            <th>Nationality</th>
            <th>Gender</th>
        </tr>
        </thead>
        <tbody id="touristList">
        <tr><td colspan="6" style="padding:60px; color:#999;">날짜를 선택하고 [조회] 버튼을 눌러주세요.</td></tr>
        </tbody>
    </table>

</div>

<script th:inline="javascript">
    const guideId = /*[[${guideId}]]*/ null;

    document.getElementById('dateFilter').valueAsDate = new Date();

    async function loadTourists() {
        const date = document.getElementById('dateFilter').value;
        if (!date) {
            alert('날짜를 선택해주세요!');
            return;
        }

        document.getElementById('touristList').innerHTML = '<tr><td colspan="6">로딩 중...</td></tr>';

        try {
            const res = await fetch(`/api/tourists?guideId=${guideId}&date=${date}`);
            if (!res.ok) throw new Error();

            const tourists = await res.json();
            const realPassengerCount = tourists.length;
            const displayedPassengerCount = realPassengerCount + 1; // 기사 포함해서 승객 수로 표시

            // 여기서 핵심! 승객 칸에 (실제 승객 + 1) 표시
            document.getElementById('passengerCount').textContent = displayedPassengerCount;

            if (realPassengerCount === 0) {
                document.getElementById('touristList').innerHTML =
                    '<tr><td colspan="6" style="padding:70px; color:#999; font-size:16px;">해당 날짜에 등록된 관광객이 없습니다.</td></tr>';
                return;
            }

            const rows = tourists.map((t, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${t.name}</strong></td>
                    <td>${t.birth || '-'}</td>
                    <td>${t.phone || '-'}</td>
                    <td>${t.nationality || '-'}</td>
                    <td>${t.gender === 'MALE' ? 'M' : 'F'}</td>
                </tr>
            `).join('');

            document.getElementById('touristList').innerHTML = rows;

        } catch (e) {
            console.error(e);
            document.getElementById('touristList').innerHTML =
                '<tr><td colspan="6" style="padding:70px; color:red;">데이터를 불러오지 못했습니다.</td></tr>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.title = /*[[${guideName}]]*/ + ' 가이드님 관광객 명단';
        loadTourists();
    });
</script>
</body>
</html>
