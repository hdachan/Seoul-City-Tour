<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>가이드 관리</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background:#f9f9f9; padding:30px 0; font-family:system-ui,-apple-system,sans-serif; }
        .container { max-width:1200px; }
        h3 { font-weight:600; }
        .table thead { background:#0d6efd; color:white; }
        .table th, .table td { vertical-align:middle; font-size:0.95rem; }
        .qr-box { width:85px; height:85px; margin:0 auto; }
        .today-count {
            background:#0d6efd;
            color:white;
            font-weight:bold;
            padding:6px 14px;
            border-radius:8px;
            min-width:80px;
            display:inline-block;
            text-align:center;
            font-size:0.9rem;
        }
        .password-toggle { cursor:pointer; color:#666; }
        .today-count:hover { background:#0d5bd8; }
    </style>
</head>
<body>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>가이드 관리</h3>
        <button class="btn btn-primary" id="openRegisterModal">
            <i class="bi bi-person-plus"></i> 가이드 추가
        </button>
    </div>

    <div id="guideList" class="bg-white rounded shadow-sm p-4">
        <div class="text-center py-5 text-muted">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3">가이드 목록을 불러오는 중...</p>
        </div>
    </div>
</div>

<!-- 가이드 등록/수정 모달 -->
<div class="modal fade" id="guideModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <form id="guideForm" class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">가이드 등록</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editGuideId">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">로그인 ID <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="loginId" required maxlength="20">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" id="pwLabel">비밀번호 <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="guidePassword" required>
                            <span class="input-group-text password-toggle" onclick="toggleModalPw()">
                                <i class="bi bi-eye-slash" id="pwIcon"></i>
                            </span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">이름 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="guideName" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">생년월일 <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="guideBirth" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">전화번호</label>
                        <input type="tel" class="form-control" id="guidePhone" placeholder="010-1234-5678">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">국적/지역</label>
                        <input type="text" class="form-control" id="guideNationality" placeholder="예: 한국, 일본, 중국">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">성별</label>
                        <select class="form-select" id="guideGender">
                            <option value="남">남성</option>
                            <option value="여">여성</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="submit" class="btn btn-primary" id="submitBtn">등록하기</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
    const API = '/api/guides';
    const BASE = location.origin;
    let currentEditId = null;
    let originalLoginId = '';

    // 비밀번호 보기 토글
    function toggleModalPw() {
        const pw = document.getElementById('guidePassword');
        const icon = document.getElementById('pwIcon');
        if (pw.type === 'password') {
            pw.type = 'text';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        } else {
            pw.type = 'password';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        }
    }

    // 가이드 목록 불러오기
    async function loadGuides() {
        try {
            const res = await fetch(API);
            const guides = await res.json();

            if (guides.length === 0) {
                document.getElementById('guideList').innerHTML =
                    '<div class="text-center py-5"><h5 class="text-muted">등록된 가이드가 없습니다.</h5><p>오른쪽 상단 [+ 가이드 추가] 버튼을 눌러 등록해주세요.</p></div>';
                return;
            }

            let rows = '';
            guides.forEach((g, i) => {
                const qrId = `qr_${g.id}`;
                rows += `
                <tr>
                    <td class="text-center fw-bold">${i + 1}</td>
                    <td><strong>${escapeHtml(g.loginId)}</strong></td>
                    <td><strong>${escapeHtml(g.name)}</strong></td>
                    <td>
                        <span id="pw_${g.id}">••••••••</span>
                        <i class="bi bi-eye password-toggle ms-2" onclick="togglePw('${g.id}', '${escapeHtml(g.password)}')"></i>
                    </td>
                    <td>${g.birth || '-'}</td>
                    <td>${g.phone || '-'}</td>
                    <td>${g.nationality || '-'}</td>
                    <td class="text-center">${g.gender === 'MALE' ? '남' : '여'}</td>
                    <td class="text-center" style="cursor:pointer;" title="클릭 시 해당 가이드 명단 보기"
                        onclick="window.open('/admin/guide-tourists.html?guideId=${g.id}&name=${encodeURIComponent(g.name)}','_blank')">
                        <span class="today-count">${g.touristCount}명</span>
                    </td>
                    <td class="text-center"><div id="${qrId}" class="qr-box"></div></td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-secondary me-1"
                                onclick="openEdit('${g.id}','${escapeHtml(g.loginId)}','${escapeHtml(g.name)}','${g.birth}','${g.phone||''}','${g.nationality||''}','${g.gender}')">
                            수정
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteGuide('${g.id}')">
                            삭제
                        </button>
                    </td>
                </tr>`;
            });

            document.getElementById('guideList').innerHTML = `
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>로그인ID</th>
                                <th>이름</th>
                                <th>비밀번호</th>
                                <th>생년월일</th>
                                <th>전화번호</th>
                                <th>국적</th>
                                <th>성별</th>
                                <th class="text-center">오늘 등록된 관광객</th>
                                <th>QR코드</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;

            // QR 코드 생성
            guides.forEach(g => {
                new QRCode(document.getElementById(`qr_${g.id}`), {
                    text: `${BASE}/tourist/register?guideId=${g.id}`,
                    width: 85,
                    height: 85,
                    colorDark: "#000000",
                    colorLight: "#ffffff"
                });
            });

        } catch (err) {
            console.error(err);
            document.getElementById('guideList').innerHTML =
                '<div class="text-center py-5 text-danger"><h5>가이드 목록을 불러오지 못했습니다.</h5></div>';
        }
    }

    // 비밀번호 보기 토글
    window.togglePw = (id, real) => {
        const el = document.getElementById('pw_' + id);
        el.textContent = el.textContent === '••••••••' ? real : '••••••••';
    };

    // 수정 모달 열기
    window.openEdit = (id, loginId, name, birth, phone, nat, gender) => {
        currentEditId = id;
        originalLoginId = loginId;
        document.getElementById('modalTitle').textContent = '가이드 수정';
        document.getElementById('submitBtn').textContent = '수정하기';
        document.getElementById('pwLabel').innerHTML = '비밀번호 (변경시에만 입력)';
        document.getElementById('guidePassword').removeAttribute('required');
        document.getElementById('guidePassword').value = '';

        document.getElementById('loginId').value = loginId;
        document.getElementById('guideName').value = name;
        document.getElementById('guideBirth').value = birth;
        document.getElementById('guidePhone').value = phone || '';
        document.getElementById('guideNationality').value = nat || '';
        document.getElementById('guideGender').value = gender === 'MALE' ? '남' : '여';

        new bootstrap.Modal('#guideModal').show();
    };

    // 등록 모달 열기
    document.getElementById('openRegisterModal').onclick = () => {
        currentEditId = null;
        originalLoginId = '';
        document.getElementById('guideForm').reset();
        document.getElementById('modalTitle').textContent = '가이드 등록';
        document.getElementById('submitBtn').textContent = '등록하기';
        document.getElementById('pwLabel').innerHTML = '비밀번호 <span class="text-danger">*</span>';
        document.getElementById('guidePassword').setAttribute('required', '');
        new bootstrap.Modal('#guideModal').show();
    };

    // 등록/수정 제출
    document.getElementById('guideForm').onsubmit = async e => {
        e.preventDefault();
        const isEdit = !!currentEditId;

        const data = {
            loginId: document.getElementById('loginId').value.trim(),
            password: document.getElementById('guidePassword').value || null,
            name: document.getElementById('guideName').value.trim(),
            birth: document.getElementById('guideBirth').value,
            phone: document.getElementById('guidePhone').value.trim() || null,
            nationality: document.getElementById('guideNationality').value.trim() || null,
            gender: document.getElementById('guideGender').value
        };

        // 로그인 ID 중복 체크
        if (!isEdit || data.loginId !== originalLoginId) {
            const dup = await fetch(`${API}/check-id?loginId=${encodeURIComponent(data.loginId)}`).then(r => r.json());
            if (dup) return alert('이미 사용 중인 로그인 ID입니다.');
        }

        const url = isEdit ? `${API}/${currentEditId}` : `${API}/register`;
        const method = isEdit ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            alert(isEdit ? '가이드 정보가 수정되었습니다.' : '가이드가 성공적으로 등록되었습니다.');
            bootstrap.Modal.getInstance('#guideModal').hide();
            loadGuides();
        } else {
            alert('처리 중 오류가 발생했습니다: ' + await res.text());
        }
    };

    // 가이드 삭제
    window.deleteGuide = async id => {
        if (!confirm('정말 삭제하시겠습니까?\n이 가이드와 연결된 모든 관광객 데이터도 함께 삭제됩니다.')) return;
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (res.ok) {
            alert('가이드가 삭제되었습니다.');
            loadGuides();
        } else {
            alert('삭제 실패');
        }
    };

    // HTML 이스케이프
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 페이지 로드 시 실행
    loadGuides();
</script>
</body>
</html>
