<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>전체 관광객 명단</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background:#f8f9fa; padding:20px; margin:0; font-family:'Malgun Gothic',sans-serif; }
        .container { max-width:100% !important; padding:15px; }
        .card { box-shadow:0 1px 3px rgba(0,0,0,.1); border-radius:8px; }
        .table { font-size:0.9rem; }
        .table th { background:#467FF7; color:white; text-align:center; position:sticky; top:0; z-index:10; }
        .table td { vertical-align:middle; text-align:center; }
        .guide-row { background:#e3f2fd !important; font-weight:bold; font-size:1rem; }
        .guide-row td:first-child { color:#d32f2f; }
        .tourist-row:nth-of-type(even) { background:#fff8e1; }
        @media print {
            body * { visibility:hidden; }
            #printArea, #printArea * { visibility:visible; }
            #printArea { position:absolute; left:0; top:0; width:100%; padding:10px; background:#fff; }
            .no-print, .card, .d-flex > *:not(h4) { display:none !important; }
            .container { padding:0 !important; }
            table { font-size:11pt; }
        }
        .empty-state { padding:5rem 2rem; text-align:center; color:#6c757d; }
        .badge-male { background:#0d6efd !important; }
        .badge-female { background:#e91e63 !important; }
        #loading {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(255,255,255,0.97); display:flex; flex-direction:column;
            align-items:center; justify-content:center; z-index:9999; backdrop-filter:blur(4px);
        }
    </style>
</head>
<body>
<div class="container">

    <div class="d-flex justify-content-between align-items-center my-4">
        <h4 class="text-success fw-bold m-0">보험가입을 위한 명단 출력 & 인솔자별 QR출력</h4>
        <div class="btn-group">
            <button class="btn btn-success btn-sm" onclick="downloadExcel('insurance')">보험용 엑셀</button>
            <button class="btn btn-info btn-sm text-white" onclick="downloadExcel('paju')">파주시용 엑셀</button>
            <button class="btn btn-secondary btn-sm" onclick="window.print()">인쇄</button>
        </div>
    </div>

    <div class="card mb-3 p-3">
        <div class="row g-2 align-items-center">
            <div class="col-auto"><strong>조회 기간</strong></div>
            <div class="col-auto"><input type="date" id="startDate" class="form-control form-control-sm"></div>
            <div class="col-auto">~</div>
            <div class="col-auto"><input type="date" id="endDate" class="form-control form-control-sm"></div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" onclick="loadTourists()">조회</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetDate()">오늘</button>
            </div>
            <div class="col-auto ms-auto">
                <span id="totalCount" class="badge bg-primary fs-6">0명</span>
            </div>
        </div>
    </div>

    <div id="loading">
        <div class="spinner-border text-primary" style="width:4rem;height:4rem;"></div>
        <p class="mt-4 fs-5 text-muted">데이터를 빠르게 준비하고 있어요...</p>
    </div>

    <div id="printArea">
        <div class="table-responsive">
            <table class="table table-sm table-hover table-striped table-bordered align-middle">
                <thead>
                <tr>
                    <th width="60">No.</th>
                    <th width="120">이름</th>
                    <th width="130">생년월일</th>
                    <th width="140">연락처</th>
                    <th width="100">국적</th>
                    <th width="80">성별</th>
                    <th width="160">등록시간</th>
                    <th width="80" class="no-print">삭제</th>
                </tr>
                </thead>
                <tbody id="touristBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const fmtKst = (dateStr) => new Date(dateStr).toLocaleString('ko-KR', {
        timeZone: 'Asia/Seoul',
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
        hour12: false
    });

    function toKoreanGender(g) {
        if (!g) return '-';
        return g.trim().toUpperCase() === 'MALE' ? '남' : '여';
    }

    function getBadge(g) {
        return toKoreanGender(g) === '남' ? 'badge-male' : 'badge-female';
    }

    function escape(s) {
        return s ? String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : '-';
    }

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;
        loadTourists();
    });

    window.resetDate = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;
        loadTourists();
    };

    // 핵심: setTimeout + requestAnimationFrame 으로 메인 스레드 완전 해방!
    async function loadTourists() {
        const start = document.getElementById('startDate').value;
        const end   = document.getElementById('endDate').value;
        const loading = document.getElementById('loading');
        const tbody   = document.getElementById('touristBody');

        loading.style.display = 'flex';
        tbody.innerHTML = '';

        let url = '/api/tourists/all';
        if (start && end) url += `?start=${start}&end=${end}`;

        let data;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('서버 오류');
            data = await res.json();
        } catch (e) {
            console.error(e);
            tbody.innerHTML = `<tr><td colspan="8" class="text-danger">오류: ${e.message}</td></tr>`;
            loading.style.display = 'none';
            return;
        }

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><h4>등록된 관광객이 없습니다</h4></td></tr>';
            document.getElementById('totalCount').textContent = '0명';
            loading.style.display = 'none';
            return;
        }

        // 그룹화 (빠르게)
        let totalPeople = 0;
        const groups = {};
        data.forEach(t => {
            const key = t.guideId || t.guideName;
            if (!groups[key]) {
                groups[key] = {
                    info: { name: t.guideName, birth: t.guideBirth || '', phone: t.guidePhone || '',
                        country: t.guideNationality || '', gender: t.guideGender },
                    tourists: []
                };
                totalPeople++;
            }
            groups[key].tourists.push(t);
            totalPeople++;
        });
        document.getElementById('totalCount').textContent = totalPeople + '명';

        // 여기서부터 진짜 마법: 메인 스레드를 아예 안 막음!
        const fragment = document.createDocumentFragment();
        let no = 1;

        Object.values(groups).forEach(g => {
            const guideTr = document.createElement('tr');
            guideTr.className = 'guide-row';
            guideTr.innerHTML = `<td><strong>${no++}</strong></td><td><strong>${escape(g.info.name)}</strong></td><td>${escape(g.info.birth || '-')}</td><td>${escape(g.info.phone || '-')}</td><td>${escape(g.info.country || '-')}</td><td><span class="badge ${getBadge(g.info.gender)}">${toKoreanGender(g.info.gender)}</span></td><td>-</td><td class="no-print">-</td>`;
            fragment.appendChild(guideTr);

            g.tourists.forEach(t => {
                const tr = document.createElement('tr');
                tr.className = 'tourist-row';
                tr.innerHTML = `<td><strong>${no++}</strong></td><td><strong>${escape(t.name)}</strong></td><td>${escape(t.birth || '-')}</td><td>${escape(t.phone || '-')}</td><td>${escape(t.country || '-')}</td><td><span class="badge ${getBadge(t.gender)}">${toKoreanGender(t.gender)}</span></td><td>${fmtKst(t.time)}</td><td class="no-print"><button class="btn btn-danger btn-sm" onclick="deleteTourist('${t.id}',this)">삭제</button></td>`;
                fragment.appendChild(tr);
            });
        });

        // 다음 프레임에 삽입 → 브라우저가 숨 쉴 틈을 줌 → 완전 부드러움!
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                tbody.appendChild(fragment);
                loading.style.display = 'none';
            });
        });
    }

    window.deleteTourist = async (id, btn) => {
        if (!confirm('삭제하시겠습니까?')) return;
        try {
            await fetch(`/api/tourists/${id}`, {method:'DELETE'});
            btn.closest('tr').remove();
            loadTourists();
        } catch { alert('삭제 실패'); }
    };

    // 엑셀은 그대로
    window.downloadExcel = function(type) {
        const rows = Array.from(document.querySelectorAll('#touristBody tr'));
        const list = [];

        rows.forEach(r => {
            const c = r.cells;
            const name = c[1].querySelector('strong')?.textContent.trim() || c[1].textContent.trim();
            const birth = c[2].textContent.trim() === '-' ? '' : c[2].textContent.trim();
            const phone = c[3].textContent.trim();
            const country = c[4].textContent.trim();
            const krGender = c[5].querySelector('.badge')?.textContent.trim() || '';
            const gender = krGender === '남' ? 'M' : krGender === '여' ? 'F' : '';

            list.push({ no: c[0].textContent.trim(), name, birth, phone, country, gender });
        });

        const headers = type === 'insurance'
            ? ['No.', 'NAME', 'Date of Birth', 'Gender']
            : ['No.', 'NAME', 'Date of Birth', 'Phone No.', 'Nationality', 'Gender'];

        const excelData = list.map(d => type === 'insurance'
            ? [d.no, d.name, d.birth, d.gender]
            : [d.no, d.name, d.birth, d.phone, d.country, d.gender]);

        const ws = XLSX.utils.aoa_to_sheet([headers, ...excelData]);
        ws['!cols'] = type === 'insurance'
            ? [{wch:6}, {wch:22}, {wch:15}, {wch:8}]
            : [{wch:6}, {wch:22}, {wch:15}, {wch:16}, {wch:14}, {wch:8}];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '명단');
        const s = document.getElementById('startDate').value || 'all';
        const e = document.getElementById('endDate').value || 'all';
        XLSX.writeFile(wb, `관광객명단_${type==='insurance'?'보험용':'파주시용'}_${s}_to_${e}.xlsx`);
    };
</script>
</body>
</html>
