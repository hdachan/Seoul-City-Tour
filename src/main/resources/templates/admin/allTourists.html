<!-- resources/templates/admin/allTourists.html 전체 수정본 -->

<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>전체 관광객 명단</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background:#f8f9fa; padding:20px; margin:0; font-family:'Malgun Gothic',sans-serif; }
        .container { max-width:100% !important; padding:15px; }
        .card { box-shadow:0 1px 3px rgba(0,0,0,.1); border-radius:8px; }
        .table { font-size:0.9rem; }
        .table th { background:#467FF7; color:white; text-align:center; }
        .table td { vertical-align:middle; text-align:center; }
        .guide-row { background:#e3f2fd !important; font-weight:bold; }
        .guide-row td:first-child { color:#d32f2f; font-weight:bold; }
        @media print {
            body * { visibility:hidden; }
            #printArea, #printArea * { visibility:visible; }
            #printArea { position:absolute; left:0; top:0; width:100%; padding:10px; background:#fff; }
            .no-print, .card, .d-flex > *:not(h4) { display:none !important; }
            .container { padding:0 !important; }
            table { font-size:11pt; }
            .guide-row { background:#e3f2fd !important; }
        }
        .empty-state { padding:5rem 2rem; text-align:center; color:#6c757d; }
        .badge-male { background:#0d6efd !important; }
        .badge-female { background:#e91e63 !important; }
    </style>
</head>
<body>
<div class="container">

    <div class="d-flex justify-content-between align-items-center my-4">
        <h4 class="text-success fw-bold m-0">전체 관광객 명단 출력</h4>
        <div class="btn-group">
            <button class="btn btn-success btn-sm" onclick="downloadExcel('insurance')">보험용 엑셀</button>
            <button class="btn btn-info btn-sm text-white" onclick="downloadExcel('paju')">파주시용 엑셀</button>
            <button class="btn btn-secondary btn-sm" onclick="window.print()">인쇄</button>
        </div>
    </div>

    <div class="card mb-3 p-3">
        <div class="row g-2 align-items-center">
            <div class="col-auto"><strong>조회 기간</strong></div>
            <div class="col-auto"><input type="date" id="startDate" class="form-control form-control-sm"></div>
            <div class="col-auto">~</div>
            <div class="col-auto"><input type="date" id="endDate" class="form-control form-control-sm"></div>
            <div class="col-auto">
                <button class="btn btn-primary btn-sm" onclick="loadTourists()">조회</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetDate()">오늘</button>
            </div>
            <div class="col-auto ms-auto">
                <span id="totalCount" class="badge bg-primary fs-6">0명</span>
            </div>
        </div>
    </div>

    <div id="loading" class="text-center py-5" style="display:none;">
        <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
        <p class="mt-3 text-muted">관광객 데이터를 불러오는 중...</p>
    </div>

    <div id="printArea">
        <div class="table-responsive">
            <table class="table table-sm table-hover table-striped table-bordered align-middle">
                <thead>
                <tr>
                    <th width="60">No.</th>
                    <th width="120">이름</th>
                    <th width="130">생년월일</th>
                    <th width="140">연락처</th>
                    <th width="100">국적</th>
                    <th width="80">성별</th>
                    <th width="160">등록시간</th>
                    <th width="80" class="no-print">삭제</th>
                </tr>
                </thead>
                <tbody id="touristBody">
                <tr><td colspan="8" class="text-center py-5 text-muted">조회 버튼을 눌러주세요</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;
        loadTourists();
    });

    window.resetDate = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;
        loadTourists();
    };

    async function loadTourists() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        const loading = document.getElementById('loading');
        const tbody = document.getElementById('touristBody');

        loading.style.display = 'block';
        tbody.innerHTML = '';

        let url = '/api/tourists/all';
        if (start && end) url += `?start=${start}&end=${end}`;

        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('데이터 로드 실패');
            const tourists = await res.json();
            loading.style.display = 'none';

            if (tourists.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state">
                    <h4 class="mt-4">등록된 관광객이 없습니다</h4>
                    <p>선택한 날짜에 등록된 관광객이 없어요.</p>
                </td></tr>`;
                document.getElementById('totalCount').textContent = '0명';
                return;
            }

            document.getElementById('totalCount').textContent = tourists.length + '명';

            // 가이드 이름 가져오기 (tourists[0].guideName 사용 → 오류 없음!)
            const guideName = tourists[0]?.guideName || '알 수 없음';

            let rows = '';

            // 1번: 가이드 행 (등록시간 비우고, 진하게)
            rows += `
                <tr class="guide-row">
                    <td><strong>1</strong></td>
                    <td><strong>${escape(guideName)}</strong></td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td class="no-print">-</td>
                </tr>`;

            // 2번부터: 실제 관광객 (번호는 2부터 시작)
            rows += tourists.map((t, i) => `
                <tr ${i % 2 === 0 ? 'style="background:#fff8e1"' : ''}>
                    <td><strong>${i + 2}</strong></td>
                    <td><strong>${escape(t.name)}</strong></td>
                    <td>${escape(t.birth || '-')}</td>
                    <td>${escape(t.phone || '-')}</td>
                    <td>${escape(t.country || '-')}</td>
                    <td><span class="badge ${t.gender === '남' ? 'badge-male' : 'badge-female'}">${escape(t.gender || '-').trim()}</span></td>
                    <td>${new Date(t.time).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })}</td>
                    <td class="no-print"><button class="btn btn-danger btn-sm" onclick="deleteTourist('${t.id}', this)">삭제</button></td>
                </tr>
            `).join('');

            tbody.innerHTML = rows;

        } catch (err) {
            console.error(err);
            loading.style.display = 'none';
            tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center py-4">오류: ${err.message}</td></tr>`;
        }
    }

    window.deleteTourist = async (id, btn) => {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        try {
            const res = await fetch(`/api/tourists/${id}`, { method: 'DELETE' });
            if (res.ok) {
                btn.closest('tr').remove();
                loadTourists();
            } else {
                alert('삭제 실패');
            }
        } catch {
            alert('삭제 실패');
        }
    };

    function escape(str) {
        if (!str) return '-';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    window.downloadExcel = function(type) {
        const guideName = document.querySelector('.guide-row td:nth-child(2)')?.textContent.trim() || '';
        const rows = Array.from(document.querySelectorAll('#touristBody tr')).slice(1); // 가이드 제외
        const data = rows.map(row => {
            const cells = row.querySelectorAll('td');
            const genderText = cells[5]?.querySelector('.badge')?.textContent || '';
            return {
                name: cells[1]?.textContent.trim() || '',
                birth: cells[2]?.textContent.trim() || '',
                phone: cells[3]?.textContent.trim() || '',
                country: cells[4]?.textContent.trim() || '',
                gender: genderText.trim()
            };
        });

        let headers = type === 'insurance'
            ? ['No.', 'Guide', 'NAME', 'Date of Birth', 'Gender']
            : ['No.', 'Guide', 'NAME', 'Date of Birth', 'Phone No.', 'Nationality', 'Gender'];

        const rowsForExcel = data.map((d, i) => {
            const row = type === 'insurance'
                ? [i+2, guideName, d.name, d.birth === '-' ? '' : d.birth, d.gender]
                : [i+2, guideName, d.name, d.birth === '-' ? '' : d.birth, d.phone, d.country, d.gender];
            return row;
        });

        const ws = XLSX.utils.aoa_to_sheet([headers, ...rowsForExcel]);
        ws['!cols'] = headers.map(() => ({ wch: 18 }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '관광객명단');

        const start = document.getElementById('startDate').value || 'all';
        const end = document.getElementById('endDate').value || 'all';
        XLSX.writeFile(wb, `관광객명단_${type === 'insurance' ? '보험용' : '파주시용'}_${start}_to_${end}.xlsx`);
    };
</script>
</body>
</html>
