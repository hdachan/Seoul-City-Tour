<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>서울 시티 투어 - 관리자 시스템</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding-top: 20px; }
        .nav-tabs .nav-link { font-weight: 500; }
        .tab-pane { background: white; border: 1px solid #dee2e6; border-top: none; border-radius: 0 0 8px 8px; padding: 20px; min-height: 70vh; }
        .btn-logout { position: fixed; top: 15px; right: 20px; z-index: 1000; }
        iframe { width: 100%; height: 80vh; border: none; }
        .qr-card { transition: transform 0.2s; }
        .qr-card:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<a href="/guide/logout" class="btn btn-outline-danger btn-sm btn-logout">
    로그아웃
</a>

<div class="container">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold text-primary">서울 시티 투어 관리자 시스템</h1>
        <p class="text-muted">관리자 <strong th:text="${guide.name}"></strong>님, 환영합니다</p>
    </div>

    <ul class="nav nav-tabs mb-4" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-guides">가이드 관리</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-qr">QR 전체 출력</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-tourists">전체 관광객 명단</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-categories">카테고리 관리</button>
        </li>
    </ul>

    <div class="tab-content">

        <!-- 1. 가이드 관리 -->
        <div class="tab-pane fade show active" id="tab-guides">
            <iframe src="/admin/register-guide.html" frameborder="0"></iframe>
        </div>

        <!-- 2. QR 전체 출력 + 개별 다운로드 + 전체 ZIP 다운로드 -->
        <div class="tab-pane fade" id="tab-qr">
            <div class="text-center mb-4">
                <h4 class="mb-3 text-success fw-bold">모든 가이드 QR 코드 출력</h4>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="window.print()">
                        인쇄하기
                    </button>
                    <button class="btn btn-primary" onclick="downloadAllQR()">
                        전체 QR ZIP 다운로드
                    </button>
                </div>
            </div>
            <div id="qrContainer" class="row g-3"></div>
        </div>

        <!-- 3. 전체 관광객 명단 (iframe으로 완벽 연결!) -->
        <div class="tab-pane fade" id="tab-tourists">
            <iframe src="/admin/all-tourists.html" frameborder="0"></iframe>
        </div>

        <!-- 4. 카테고리 관리 -->
        <div class="tab-pane fade" id="tab-categories">
            <h4>카테고리 관리</h4>
            <p>아직 구현 중입니다... (다음에 추가할게요!)</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>

<script>
    const BASE = location.origin;

    // QR 전체 출력 + 개별 다운로드 버튼 포함
    async function loadQR() {
        try {
            const res = await fetch('/api/guides');
            if (!res.ok) throw new Error('가이드 목록을 불러올 수 없습니다.');

            const guides = await res.json();
            const container = document.getElementById('qrContainer');

            if (guides.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5"><h5 class="text-muted">등록된 가이드가 없습니다</h5></div>';
                return;
            }

            container.innerHTML = guides.map(g => `
                <div class="col-6 col-md-4 col-lg-3 text-center">
                    <div class="qr-card border p-4 bg-white shadow-sm">
                        <h6 class="mb-2 fw-bold">${escape(g.name)} 가이드</h6>
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${BASE}/tourist/register?guideId=${g.id}"
                             alt="QR" class="img-fluid mb-3">
                        <p class="small text-muted mb-2">${escape(g.loginId)}</p>
                        <button class="btn btn-sm btn-primary w-100" onclick="downloadSingleQR('${g.id}', '${escape(g.name)}')">
                            QR 다운로드
                        </button>
                    </div>
                </div>
            `).join('');

        } catch (err) {
            document.getElementById('qrContainer').innerHTML =
                `<div class="col-12 text-center text-danger py-5">오류: ${err.message}</div>`;
        }
    }

    // 개별 QR 다운로드 (클릭하면 바로 다운로드!)
    window.downloadSingleQR = async (guideId, guideName) => {
        const url = `https://api.qrserver.com/v1/create-qr-code/?size=800x800&data=${BASE}/tourist/register?guideId=${guideId}`;
        try {
            const response = await fetch(url);
            const blob = await response.blob();
            saveAs(blob, `${guideName}_가이드_QR.png`);
        } catch {
            alert('QR 다운로드 실패');
        }
    };

    // 전체 QR ZIP 다운로드
    window.downloadAllQR = async () => {
        const zip = new JSZip();
        try {
            const res = await fetch('/api/guides');
            const guides = await res.json();

            for (const g of guides) {
                const url = `https://api.qrserver.com/v1/create-qr-code/?size=800x800&data=${BASE}/tourist/register?guideId=${g.id}`;
                const response = await fetch(url);
                const blob = await response.blob();
                zip.file(`${g.name}_가이드_QR.png`, blob);
            }

            const content = await zip.generateAsync({ type: "blob" });
            saveAs(content, "서울시티투어_전체가이드_QR.zip");
        } catch {
            alert('전체 다운로드 실패');
        }
    };

    function escape(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 탭 전환 시 QR 로드
    document.querySelectorAll('[data-bs-toggle="tab"]').forEach(tab => {
        tab.addEventListener('shown.bs.tab', e => {
            if (e.target.getAttribute('data-bs-target') === '#tab-qr') {
                loadQR();
            }
        });
    });

    // 페이지 로드 시 오늘 날짜 설정
    document.addEventListener('DOMContentLoaded', () => {
        // QR 탭이 기본이면 자동 로드
        if (location.hash === '#tab-qr' || !location.hash) {
            const qrTab = document.querySelector('[data-bs-target="#tab-qr"]');
            if (qrTab) new bootstrap.Tab(qrTab).show();
        }
    });
</script>
</body>
</html>
