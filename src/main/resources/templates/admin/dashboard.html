<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 대시보드</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container mt-5">
    <div class="text-center py-5">
        <h1 class="display-1 fw-bold text-danger">관리자 전용</h1>
        <h2 class="display-4 mt-4">최고관리자 <span th:text="${guide.name}"></span>님</h2>
        <p class="lead mt-5">전체 시스템 관리 권한 보유</p>
        <hr class="bg-white">
        <p>ID: <strong th:text="${guide.loginId}"></strong></p>
        <a href="/guide/logout" class="btn btn-outline-light btn-lg mt-4">로그아웃</a>
    </div>
</div>
</body>
</html>
