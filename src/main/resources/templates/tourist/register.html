<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8">
    <title>관광객 등록</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 30px; }
        .card { max-width: 500px; margin: 50px auto; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .header { background: #198754; color: white; padding: 1rem; }
        .lang-select { max-width: 110px; }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header header text-center d-flex justify-content-between align-items-center px-3">
        <h4 id="guideName" class="mb-0" th:text="${guide.name} + ' 가이드님 단체'">로딩중...</h4>
        <select id="langSelect" class="form-select form-select-sm lang-select">
            <option value="ko">한국어</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
        </select>
    </div>

    <div class="card-body">
        <form id="touristForm">
            <input type="hidden" th:value="${guide.id}" id="guideId">

            <div class="mb-3">
                <label class="form-label" id="labelName">이름 <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" required>
            </div>

            <div class="mb-3">
                <label class="form-label" id="labelBirth">생년월일 <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="birth" required>
            </div>

            <div class="mb-3">
                <label class="form-label" id="labelPhone">전화번호</label>
                <input type="tel" class="form-control" id="phone">
            </div>

            <div class="mb-3">
                <label class="form-label" id="labelCountry">국적</label>
                <input type="text" class="form-control" id="country" placeholder="중국">
            </div>

            <div class="mb-3">
                <label class="form-label" id="labelGender">성별</label>
                <select class="form-select" id="gender">
                    <option value="MALE">남성</option>
                    <option value="FEMALE">여성</option>
                </select>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-success btn-lg" id="submitBtn">등록 완료</button>
            </div>
        </form>

        <div id="result" class="mt-4"></div>
    </div>
</div>

<script>
    const texts = {
        ko: { name: "이름", birth: "생년월일", phone: "전화번호", country: "국적", gender: "성별", male: "남성", female: "여성", submit: "등록 완료", success: "등록 완료!", error: "등록 실패", placeholderCountry: "중국" },
        en: { name: "Name", birth: "Date of Birth", phone: "Phone", country: "Nationality", gender: "Gender", male: "Male", female: "Female", submit: "Register", success: "Success!", error: "Failed", placeholderCountry: "China" },
        zh: { name: "姓名", birth: "出生日期", phone: "电话", country: "国籍", gender: "性别", male: "男", female: "女", submit: "完成注册", success: "注册成功！", error: "注册失败", placeholderCountry: "中国" }
    };

    let lang = 'ko';
    const urlParams = new URLSearchParams(location.search);
    if (['en','zh'].includes(urlParams.get('lang'))) lang = urlParams.get('lang');

    function applyLang(l) {
        lang = l;
        const t = texts[l];
        document.getElementById('labelName').firstChild.textContent = t.name + ' ';
        document.getElementById('labelBirth').firstChild.textContent = t.birth + ' ';
        document.getElementById('labelPhone').textContent = t.phone;
        document.getElementById('labelCountry').textContent = t.country;
        document.getElementById('labelGender').textContent = t.gender;
        document.getElementById('submitBtn').textContent = t.submit;
        document.getElementById('country').placeholder = t.placeholderCountry;

        const opts = document.getElementById('gender').options;
        opts[0].text = t.male; opts[0].value = l === 'en' ? 'Male' : (l === 'zh' ? '男' : '남');
        opts[1].text = t.female; opts[1].value = l === 'en' ? 'Female' : (l === 'zh' ? '女' : '여');

        history.replaceState(null, '', location.pathname + '?lang=' + l);
    }

    document.getElementById('langSelect').value = lang;
    document.getElementById('langSelect').onchange = (e) => applyLang(e.target.value);
    applyLang(lang);

    document.getElementById('touristForm').onsubmit = async (e) => {
        e.preventDefault();
        const t = texts[lang];

        const tourist = {
            guide: { id: document.getElementById('guideId').value },
            name: document.getElementById('name').value.trim(),
            birth: document.getElementById('birth').value,
            phone: document.getElementById('phone').value.trim() || null,
            country: document.getElementById('country').value.trim() || null,
            gender: document.getElementById('gender').value
        };

        const res = await fetch('/api/tourists/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(tourist)
        });

        const result = document.getElementById('result');
        if (res.ok) {
            result.innerHTML = `<div class="alert alert-success text-center">${t.success}</div>`;
            e.target.reset();
        } else {
            result.innerHTML = `<div class="alert alert-danger text-center">${t.error}</div>`;
        }
    };
</script>
</body>
</html>
