<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8">
    <title>서울시티투어 DMZ 관광 - 로그인</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html { height:100%; margin:0; background:#eef2f5; }
        .login-container { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
        .login-box { max-width:420px; width:100%; padding:2.5rem 2.2rem; background:white; border-radius:20px; box-shadow:0 8px 28px rgba(0,0,0,0.12); }
        h3.title { font-weight:700; font-size:1.6rem; color:#198754; }
        .btn-login { height:58px; font-size:1.05rem; font-weight:600; border-radius:14px; }
        input.form-control { height:48px; border-radius:12px; }
        .nav-tabs .nav-link { border-radius:12px 12px 0 0; }
        .nav-tabs .nav-link.active { background:#198754; color:white; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h3 class="title text-center mb-4">서울시티투어 DMZ 관광</h3>

        <!-- 하나의 폼으로 통합! -->
        <form th:action="@{/guide/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">로그인 ID</label>
                <input name="loginId" type="text" class="form-control" placeholder="아이디를 입력하세요" required/>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">비밀번호</label>
                <input name="password" type="password" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-success w-100 btn-login">
                로그인
            </button>
        </form>

        <!-- 에러 메시지 -->
        <div th:if="${msg}" class="text-danger text-center mt-4 fw-bold" th:text="${msg}"></div>
        <div th:if="${param.logout}" class="text-success text-center mt-4">
            로그아웃 되었습니다.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
