spring:
  datasource:
    url: jdbc:mysql://localhost:3306/seoulcitytour?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 2516
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update          # 개발 중이면 update로 유지하면 편함
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul   # ★ 스프링 → MySQL 저장 시 타임존 강제

  jackson:
    time-zone: Asia/Seoul        # ★ JSON 직렬화/역직렬화 시 타임존 강제
